
services:
  jekyll:
    image: ruby:3.3-bookworm

    # Working_dir hace que el comando arranque en /proyecto, dentro del contenedor
    working_dir: /proyecto

    # Ejecuta el proceso con un usuario. Si las claves están vacías usa 1000:1000
    user: "${JEKYLL_UID:-1000}:${JEKYLL_GID:-1000}"

    # DEFINE VARIABLES DE ENTORNO
    environment:
      BUNDLER_USER_HOME: /tmp/jekyll-bundler

    volumes:
      # Carpeta del proyecto de nuestro equipo hacia la carpeta /proyecto del contenedor
      - .:/proyecto
      # Guarda las dependencias de Ruby
      - gemas:/usr/local/bundle

    ports:
      # IP LOCAL: puerto de nuestro equipo : puerto del contenedor
      - "127.0.0.1:4000:4000"
      # Segundo puerto para que el navegador reciba el aviso de recarga
      - "127.0.0.1:35729:35729"

    command:
      - sh
      - -ec
      - |
        # Solo en el primer arranque de un proyecto vacío
        if [ ! -f docs/Gemfile ]; then
          gem install jekyll --version 3.10.0 --no-document
          jekyll _3.10.0_ new docs --skip-bundle
        fi

        # Bundler instala las dependencias que faltan y luego arranca Jekyll
        cd docs
        bundle check || bundle install
        exec bundle exec jekyll serve --host 0.0.0.0 --port 4000 \
          --watch --force_polling --livereload --livereload-port 35729

volumes:
  gemas:
  

